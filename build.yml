name: Compilar mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.4.2

      - name: Descomprimir proyecto
        run: unzip -o transformmod-src.zip -d proyecto

      - name: Compilar
        run: |
          cd proyecto/transformmod
          gradle build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: transformmod-jar
          path: proyecto/transformmod/build/libs/*.jar
